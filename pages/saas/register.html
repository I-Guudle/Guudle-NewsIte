<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Guudle IT Solutions">
  <meta name="description" content="Create a GUUDLE Business Operating Platform workspace and start your trial.">
  <link rel="canonical" href="https://guudle.com/pages/saas/register.html">
  <title>Start a GUUDLE Platform trial | Guudle IT Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/site-unified.css">
  <link rel="stylesheet" href="../../assets/css/guudle-platform.css">
  
</head>
<body class="gbp-page guudle-site antialiased overflow-x-hidden">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>
  <main id="main">
    <section class="gbp-auth">
      <div class="gbp-auth__card">
        <p class="gbp-kicker">Start free trial</p>
        <h1 style="font-size:1.7rem;font-weight:800;margin:0.4rem 0 0.4rem">Create your business workspace</h1>
        <p class="gbp-lead">A new tenant workspace with CRM, projects, time, and invoicing — ready to explore.</p>
        <p class="gbp-form-note" id="gbp-plan-intent" hidden></p>
        <form data-gbp-auth>
          <input type="hidden" data-gbp-role value="client">
          <label>Company name</label>
          <input type="text" required placeholder="Northline Legal">
          <label>Work email</label>
          <input type="email" required placeholder="you@company.com">
          <label>Team size</label>
          <select><option>1–5</option><option>6–20</option><option>21–50</option><option>51+</option></select>
          <label>Password</label>
          <input type="password" required placeholder="Create a password">
          <div class="gbp-actions" style="margin-top:1.1rem">
            <button type="submit" class="gbp-btn gbp-btn--navy" style="border:0;cursor:pointer;width:100%;justify-content:center">Create workspace</button>
          </div>
        </form>
        <p class="gbp-form-note">Already have access? <a href="login.html">Sign in</a> · Looking for custom SaaS build? <a href="../services/saas-platforms.html">SaaS development</a></p>
      </div>
    </section></main>
  <div id="footer-placeholder"></div>
  <script src="../../assets/js/mega-menu-webdev-data.js"></script>
  <script src="../../assets/js/mega-menu-data.js"></script>
  <script src="../../assets/js/mega-menu-render.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/guudle-platform-data.js"></script>
  <script src="../../assets/js/guudle-platform.js"></script>
  <script src="../../assets/js/parallax-unified.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>window.AOS&&AOS.init({once:true,duration:700});</script>
</body>
</html>
